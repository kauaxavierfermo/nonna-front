    <main class="container mt-4">
        <h1>Cardápio</h1>

        <div class="d-flex mb-4 gap-2" id="filtro">
            <button class="btn btn-small btn btn-outline-secondary" data-filtro="todos">Todos</button>
            <button class="btn btn-small btn btn-outline-secondary" data-filtro="massas">Massas</button>
            <button class="btn btn-small btn btn-outline-secondary" data-filtro="pizzas">Pizzas</button>
            <button class="btn btn-small btn btn-outline-secondary" data-filtro="vinhos">Vinhos</button>
            <button class="btn btn-small btn btn-outline-secondary" data-filtro="entradas">Entradas</button>
        </div>

        <div class="row" id="cardapio"></div>

        <div class="modal fade" id="apagarProdutoModal" tabindex="-1" aria-labelledby="apagarProdutoModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="apagarProdutoModalLabel"></h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body" id="apagarProdutoModalCorpo"></div>
                    <div class="modal-footer">
                        <img Class="reload-img" src="/public/images/reload.gif"
                        alt="Recarregar"hidden =true
                        id="elementoBotaoImagemREcarregar"/>

                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="button" class="btn btn-danger" id="apagarProdutoModalConfirmar">Confirmar</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <a class="botao-cadastro-produto" onClick="mostrarCadastroProdutos()">Criar Produto</a>
